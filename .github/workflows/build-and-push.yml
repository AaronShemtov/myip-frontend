name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: il-jerusalem-1.ocir.io
          username: axiwhc5fgu9i/shemtov.aaron@gmail.com
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Resolve image tags
        id: tag
        shell: bash
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "ver=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build and push linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            il-jerusalem-1.ocir.io/axiwhc5fgu9i/myip-frontend:${{ steps.tag.outputs.ver }}
            il-jerusalem-1.ocir.io/axiwhc5fgu9i/myip-frontend:${{ steps.tag.outputs.sha }}
            il-jerusalem-1.ocir.io/axiwhc5fgu9i/myip-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ steps.tag.outputs.ver }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`${{ steps.tag.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: \`linux/arm64\`" >> "$GITHUB_STEP_SUMMARY"
