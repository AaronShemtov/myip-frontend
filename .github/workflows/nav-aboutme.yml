name: one-time-aboutme-nav
on:
  push:
    branches: [nav-aboutme]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: nav-aboutme}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html'); t=p.read_text(); old='        <a href="https://1ms.my">shortener</a>\n        <a class="current" href="/">my ip</a>'
          new='        <a href="https://1ms.my">shortener</a>\n        <a href="https://aboutme.1ms.my/">about me</a>\n        <a class="current" href="/">my ip</a>'
          if old not in t: raise SystemExit('expected navigation not found')
          p.write_text(t.replace(old,new))
          PY
          rm .github/workflows/nav-aboutme.yml
          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -m 'docs: add About Me to navigation' && git push origin HEAD:nav-aboutme
