name: fix-navigation-indentation
on:
  push:
    branches: [feat/unify-primary-navigation]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/unify-primary-navigation}
      - run: |
          sed -i 's/^<button id="theme"/        <button id="theme"/' public/index.html
          rm .github/workflows/fix-nav-indent.yml
          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: preserve navigation indentation'
          git push origin HEAD:feat/unify-primary-navigation
