<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyIP — 1ms.my</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <section class="card" aria-live="polite">
        <h1>Ваш IP</h1>
        <p class="muted">Информация о текущем подключении</p>

        <div class="row">
          <div class="label">IP адрес</div>
          <div class="value" id="ip">—</div>
        </div>

        <div class="row">
          <div class="label">Страна</div>
          <div class="value" id="country">—</div>
        </div>

        <div class="row">
          <div class="label">Город</div>
          <div class="value" id="city">—</div>
        </div>

        <div class="row">
          <div class="label">Провайдер</div>
          <div class="value" id="isp">—</div>
        </div>

        <div class="actions">
          <button id="refreshBtn" type="button">Обновить</button>
          <button id="copyBtn" type="button">Скопировать IP</button>
        </div>

        <div class="small" id="status">Готово</div>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
